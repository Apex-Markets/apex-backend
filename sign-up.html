<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up | The Apex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* --- Original design preserved --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; font-family: 'Inter', sans-serif; background: #000; color: #f2f2f2; overflow: hidden; }
    
    .animated-bg::before {
      content: '';
      position: fixed; top:0; left:0; width:200%; height:200%;
      background-image: repeating-radial-gradient(circle, rgba(0,255,153,0.15) 2px, transparent 10px);
      animation: spin 30s linear infinite; z-index: 0;
    }
    @keyframes spin { from {transform:rotate(0deg) translate(-25%,-25%);} to {transform:rotate(360deg) translate(-25%,-25%);} }

    .signup-wrapper { display: flex; height: 100%; position: relative; z-index: 1; }
    .left-side, .right-side { flex: 1; padding: 40px; display:flex; flex-direction: column; justify-content:center; align-items:center; text-align:center; }
    .left-side { background: transparent; }
    .left-side h1 { font-size: 40px; font-weight: 800; margin-bottom: 16px; }
    .left-side p { font-size:16px; color:#aaa; max-width:400px; margin:0 auto; }
    .left-side .icon { margin-top:50px; width:120px; height:120px; border:2px solid #00ff99; border-radius:50%; display:flex; justify-content:center; align-items:center; font-size:60px; color:#00ff99; }

    .right-side { display:flex; justify-content:center; align-items:center; }
    .form-box { width:100%; max-width:400px; background:rgba(18,18,18,0.94); padding:30px; border-radius:12px; box-shadow:0 0 40px rgba(0,255,140,0.1);}
    .form-box h2 { font-size:22px; font-weight:600; margin-bottom:20px; color:#fff; text-align:center; }

    .form-row { display:flex; gap:12px; margin-bottom:16px; }
    .form-group { flex:1; }
    .form-group label { display:block; font-size:14px; color:#aaa; margin-bottom:6px; }
    
    /* * Modified input style to make room for the toggle icon 
     * Input width must be 100% of the parent container
     */
    .form-group input { 
      width:100%; 
      padding:12px; 
      background:#1b1b1b; 
      border:1px solid #333; 
      border-radius:8px; 
      color:#fff; 
      font-size:15px; 
      padding-right: 40px; /* Space for the icon */
    }
    .form-group input:focus { border-color:#00ff99; outline:none; background:#1f1f1f; }
    
    /* --- New CSS for Password Toggle --- */
    .password-group {
      position: relative; /* Essential for positioning the icon */
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 15px; /* Position from the right edge of the input */
      transform: translateY(-50%);
      cursor: pointer;
      color: #00ff99; /* Green icon color */
      font-size: 18px;
      z-index: 10;
    }
    /* --------------------------------- */

    .g-recaptcha { margin:20px 0; display:flex; justify-content:center; }
    .submit-btn { width:100%; margin-top:18px; background:#00ff99; color:#000; font-weight:bold; padding:14px; font-size:16px; border:none; border-radius:10px; cursor:pointer; transition:0.3s; }
    .submit-btn:hover { background:#00e68a; }
    #registerPasskeyBtn { background:#006633; margin-top:10px; }

    .message-box { margin-top:20px; padding:10px; border-radius:8px; text-align:center; font-size:14px; display:none; }
    .message-box.success { background:#28a745; color:#fff; }
    .message-box.error { background:#dc3545; color:#fff; }

    .loading-spinner { display:none; border:4px solid #f3f3f3; border-top:4px solid #00ff99; border-radius:50%; width:20px; height:20px; animation:spin-loader 1s linear infinite; margin:10px auto; }
    @keyframes spin-loader { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }

    .footer-note { font-size:12px; color:#888; margin-top:20px; text-align:center; }
    .footer-note a { color:#00ff99; text-decoration:none; }
    .footer-note a:hover { text-decoration:underline; }

    @media(max-width:768px){ .signup-wrapper{flex-direction:column;} .left-side, .right-side{padding:20px;} .left-side h1{font-size:32px;} .left-side .icon{margin-top:30px;width:80px;height:80px;font-size:40px;} }
  </style>
</head>
<body>
  <div class="animated-bg"></div>

  <div class="signup-wrapper">
    <div class="left-side">
      <h1>Create your login</h1>
      <p>We’ll need your name, email address, and a unique password. You’ll use this login to access The Apex next time.</p>
      <div class="icon"><i class="fas fa-user-plus"></i></div>
    </div>

    <div class="right-side">
      <form class="form-box" id="signupForm" novalidate>
        <h2>Sign Up</h2>
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="firstName" required />
          </div>
          <div class="form-group">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="lastName" required />
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required />
        </div>
        
        <div class="form-group">
          <label for="password">Password (at least 6 characters)</label>
          <div class="password-group">
            <input type="password" id="password" name="password" minlength="6" required />
            <i class="fas fa-eye password-toggle" id="togglePassword"></i>
          </div>
        </div>
        
        <div class="g-recaptcha" data-sitekey="6LcuiuYrAAAAAFUi2UrvLJlLiVzi8Rz_8TKzu7N2"></div>
        <button type="submit" class="submit-btn" id="submitBtn">Continue</button>
        <button type="button" id="registerPasskeyBtn" class="submit-btn">Create Passkey</button>

        <div class="loading-spinner" id="loadingSpinner"></div>
        <div class="message-box" id="messageBox" aria-live="polite"></div>

        <div class="footer-note">
          <p>Already started? <a href="https://www.theapexinvestor.com/sign-in.html">Log in to complete your application</a></p>
          <p>By continuing, you agree to The Apex <a href="#">User Agreement</a> and <a href="#">Privacy Policy</a>.</p>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-functions.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app-check.js";    const firebaseConfig = {
      apiKey: "AIzaSyAdIUF9wklnnSfIAeGlA3aw8UVCj0H0Vig",
      authDomain: "the-apex-app.firebaseapp.com",
      projectId: "the-apex-app",
      storageBucket: "the-apex-app.firebasestorage.app",
      messagingSenderId: "908808650183",
      appId: "1:908808650183:web:8112f608dd48c8140e6de2",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app);

    const appCheck = initializeAppCheck(app, {
      // ✅ CORRECTED: Use the V2 Provider name here to match the import
      provider: new ReCaptchaV3Provider('6LcuiuYrAAAAAFUi2UrvLJlLiVzi8Rz_8TKzu7N2'), 
      isTokenAutoRefreshEnabled: true
    });

    const signupForm = document.getElementById("signupForm");
    const firstNameInput = document.getElementById("first-name");
    const lastNameInput = document.getElementById("last-name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const messageBox = document.getElementById("messageBox");
    const registerPasskeyBtn = document.getElementById("registerPasskeyBtn");
    // Get the new toggle button element
    const togglePassword = document.getElementById("togglePassword");

    const createApexUser = httpsCallable(functions, "createApexUser");
    const generateRegistrationOptions = httpsCallable(functions, "generateRegistrationOptions");
    const verifyRegistration = httpsCallable(functions, "verifyRegistration");

    // --- Password Toggle Logic ---
    togglePassword.addEventListener("click", () => {
      // Toggle the type attribute between 'password' and 'text'
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);

      // Toggle the icon class for visual feedback (fa-eye <-> fa-eye-slash)
      togglePassword.classList.toggle("fa-eye");
      togglePassword.classList.toggle("fa-eye-slash");
    });
    // -----------------------------

   // --- reCAPTCHA setup ---
   

    function showMessage(msg, type) {
      messageBox.textContent = msg;
      messageBox.className = "message-box " + (type === "success" ? "success" : "error");
      messageBox.style.display = "block";
    }
    function hideMessage() {
      messageBox.style.display = "none";
      messageBox.textContent = "";
      messageBox.className = "message-box";
    }

    function bufferToBase64(buffer) { return btoa(String.fromCharCode(...new Uint8Array(buffer))); }
    function base64ToBuffer(base64) { return Uint8Array.from(atob(base64), c => c.charCodeAt(0)); }

    // --- Signup ---
   signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  hideMessage();
  submitBtn.disabled = true;
  loadingSpinner.style.display = "block";

  try {
    const userCredential = await createUserWithEmailAndPassword(
      auth,
      emailInput.value.trim(),
      passwordInput.value.trim()
    );

    console.log("User created:", userCredential.user);

    showMessage("Account created successfully! Redirecting...", "success");
    setTimeout(() => window.location.href = "/apex-tool.html", 1500);

  } catch (err) {
    console.error("Signup failed:", err);
    const errorMessage = err.message || (err.code ? `Firebase Error: ${err.code}` : "Unknown error during signup.");
    showMessage(errorMessage, "error");
    submitBtn.disabled = false;
    loadingSpinner.style.display = "none";
  }
});


    // --- Passkey ---
    registerPasskeyBtn.addEventListener("click", async () => {
      if (!auth.currentUser) { alert("Please log in first."); return; }
      try {
        const optionsResponse = await generateRegistrationOptions({ uid: auth.currentUser.uid });
        const options = optionsResponse.data;
        options.challenge = base64ToBuffer(options.challenge);
        options.user.id = base64ToBuffer(options.user.id);

        const credential = await navigator.credentials.create({ publicKey: options });
        const attestationResponse = {
          id: credential.id,
          rawId: bufferToBase64(credential.rawId),
          type: credential.type,
          response: {
            clientDataJSON: bufferToBase64(credential.response.clientDataJSON),
            attestationObject: bufferToBase64(credential.response.attestationObject)
          }
        };

        const verificationResult = await verifyRegistration(attestationResponse);
        alert(verificationResult.data.success ? "Passkey registered successfully!" : "Passkey registration failed. Please try again.");
      } catch (err) {
        console.error(err);
        alert("Error during passkey registration: " + (err.message || err));
      }
    });
  </script>
</body>
</html>
